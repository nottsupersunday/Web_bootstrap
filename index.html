<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!--Menu-->
<div id="menu-container"></div>



<!-- Content here -->
    <div class="container">
        
        <h3 class="alert alert-success mt-4">หน้าหลัก</h3>
        
    <div class="alert alert-primary text-end" role="alert">
    Worawat Pongchay
    </div>

    <div class="text-end mb-4">
    <a class="btn btn-info" href="https://www.google.co.th">Google</a>
    </div>

    
    </div> <!--end container-->


    <!--แบ่งคอลัมน์ด้วย grid System-->
      <div class="container text-center">
        <div class="row">
          <div class="col-sm-4 bg-primary-subtle">
            <img src="image/cat2.jpg" width="100%">
            รักแมว 1
          </div>
          <div class="col-4 bg-success-subtle">
            <img src="image/cat.jpg" width="100%">
            แมวน่ารัก 2
          </div>
          <div class="col-sm-4 bg-primary-subtle">
            <h4 class="mt-4">Register</h4>

        <form class="text-start">
                <div class="mb-3">
                  <label for="form-label" class="form-label">Firstname</label>
                  <input type="text" class="form-control" id="Firstname" required placeholder="input Firstname">
                  
                </div>
                <div class="mb-3">
                  <label for="form-label" class="form-label">Lastname</label>
                  <input type="text" class="form-control" id="Lastname" required placeholder="input Lastname">
                </div>
                <div class="mb-3">
                    <label for="form-label" class="form-label">Telephone</label>
                    <input type="tel" class="form-control" id="phone" required placeholder="ex. xxx-xxx-xxxx">
                  </div>
                  <div class="mb-3">
                    <label for="form-label" class="Province">Province</label>
                    <select class="form-select" id="Province" required>
                        <option selected>เลือกจังหวัด</option>
                        <option value="ชลบุรี">ชลบุรี</option>
                        <option value="ระยอง">ระยอง</option>
                        <option value="เชียงใหม่">เชียงใหม่</option>
                      </select>

                  </div>



                  <div class="mb-3">
                    <label for="form-label" class="form-label">E-mail</label>
                    <input type="text" class="form-control" id="e-mail" required placeholder="Input-email">
                    <div class="mb-3">
                        <label for="form-label" class="form-label">password</label>
                        <input type="password" class="form-control" id="pw" required placeholder="input password">
                  </div>
                <div class="text-center">
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="submit" class="btn btn-secondary">Cancel</button>
              </form>
          </div>
        </div><!--end row-->
      </div>





</body>
</html>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/menu.js"></script>
